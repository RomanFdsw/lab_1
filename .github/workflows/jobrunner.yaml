name: First job running 
on: push

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
        - name: Check code
          uses: actions/checkout@v4

        - name: Set up Node.js
          uses: actions/setup-node@v4
          with: 
            node-version: '20'
            cache: 'npm'
        
        - name: Install all dependencies
          run: npm ci 

        - name: Run linter
          run: npm run lint
  test:
      needs: [lint]
      runs-on: ubuntu-latest
      steps:
        - name: Check code
          uses: actions/checkout@v4

        - name: Set up Node.js
          uses: actions/setup-node@v4
          with: 
            node-version: '20'
            cache: 'npm'
        - name: Install dependencies
          run: npm ci
        - name: Run tests
          run: npm test
  build:
        needs: [lint,test]
        runs-on: ubuntu-latest
        steps:
        - name: Check code
          uses: actions/checkout@v4
        - name: Check node
          uses: actions/setup-node@v4
          with: 
            node-version: '20'
            cache: 'npm'
        - name: Install dependecies
          run: npm ci
        - name: Build project
          run: npm run build


           
